<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test PDF Certificat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .test-certificate { 
            width: 400px; height: 200px; border: 2px solid #1EA38B; 
            margin: 10px 0; padding: 20px; text-align: center;
            background: linear-gradient(135deg, #f6fcfa 0%, #eaf7f3 100%);
        }
        .no-print { background: #ffe6e6; padding: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Diagnostic PDF Certificat AfriCode</h1>
    
    <div class="test-section">
        <h3>📋 Tests de bibliothèques</h3>
        <div id="library-tests"></div>
    </div>
    
    <div class="test-section">
        <h3>🎯 Test de génération PDF</h3>
        <div class="test-certificate" id="test-cert">
            <h2 style="color: #1EA38B;">Certificat de Test</h2>
            <p>Ceci est un certificat de test pour AfriCode</p>
            <div class="no-print">⚠️ Cet élément ne doit pas apparaître dans le PDF</div>
        </div>
        
        <button onclick="testPDFGeneration()">
            <i class="fas fa-download"></i> Tester PDF
        </button>
        
        <button onclick="testPrintMethod()">
            <i class="fas fa-print"></i> Tester Impression
        </button>
        
        <button onclick="testCanvasMethod()">
            <i class="fas fa-image"></i> Tester Canvas
        </button>
    </div>
    
    <div class="test-section">
        <h3>📊 Résultats des tests</h3>
        <div id="test-results"></div>
    </div>

    <!-- Scripts de test -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        // Tests de diagnostic
        document.addEventListener('DOMContentLoaded', function() {
            runLibraryTests();
        });

        function runLibraryTests() {
            const results = document.getElementById('library-tests');
            const tests = [
                { name: 'html2canvas', check: () => typeof html2canvas !== 'undefined' },
                { name: 'jsPDF', check: () => typeof jsPDF !== 'undefined' },
                { name: 'html2pdf', check: () => typeof html2pdf !== 'undefined' },
                { name: 'window.print', check: () => typeof window.print === 'function' }
            ];

            tests.forEach(test => {
                const status = test.check() ? 
                    '<span class="success">✅ Disponible</span>' : 
                    '<span class="error">❌ Indisponible</span>';
                results.innerHTML += `<div><strong>${test.name}:</strong> ${status}</div>`;
            });
        }

        async function testPDFGeneration() {
            addResult('🧪 Test html2pdf...');
            
            try {
                const element = document.getElementById('test-cert');
                
                // Masquer no-print
                document.querySelectorAll('.no-print').forEach(el => el.style.display = 'none');
                
                const options = {
                    margin: 10,
                    filename: 'test-certificat.pdf',
                    image: { type: 'jpeg', quality: 0.9 },
                    html2canvas: { scale: 1 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                };
                
                await html2pdf().set(options).from(element).save();
                addResult('✅ html2pdf: SUCCÈS');
                
            } catch (error) {
                addResult(`❌ html2pdf: ÉCHEC - ${error.message}`);
                console.error('Erreur html2pdf:', error);
            } finally {
                // Réafficher no-print
                document.querySelectorAll('.no-print').forEach(el => el.style.display = '');
            }
        }

        async function testCanvasMethod() {
            addResult('🧪 Test html2canvas + jsPDF...');
            
            try {
                const element = document.getElementById('test-cert');
                
                document.querySelectorAll('.no-print').forEach(el => el.style.display = 'none');
                
                const canvas = await html2canvas(element, {
                    backgroundColor: '#ffffff',
                    scale: 1
                });
                
                const imgData = canvas.toDataURL('image/jpeg', 0.9);
                const pdf = new jsPDF('landscape', 'mm', 'a4');
                
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                
                pdf.addImage(imgData, 'JPEG', 10, 10, pdfWidth - 20, pdfHeight - 20);
                pdf.save('test-canvas-certificat.pdf');
                
                addResult('✅ Canvas + jsPDF: SUCCÈS');
                
            } catch (error) {
                addResult(`❌ Canvas + jsPDF: ÉCHEC - ${error.message}`);
                console.error('Erreur canvas:', error);
            } finally {
                document.querySelectorAll('.no-print').forEach(el => el.style.display = '');
            }
        }

        function testPrintMethod() {
            addResult('🧪 Test window.print...');
            
            try {
                const printStyles = `
                    <style>
                        @media print {
                            body * { visibility: hidden; }
                            #test-cert, #test-cert * { visibility: visible; }
                            #test-cert { position: absolute; left: 0; top: 0; }
                            .no-print { display: none !important; }
                        }
                    </style>
                `;
                
                document.head.insertAdjacentHTML('beforeend', printStyles);
                window.print();
                addResult('✅ window.print: SUCCÈS (vérifiez l\'aperçu)');
                
            } catch (error) {
                addResult(`❌ window.print: ÉCHEC - ${error.message}`);
            }
        }

        function addResult(message) {
            const results = document.getElementById('test-results');
            const time = new Date().toLocaleTimeString();
            results.innerHTML += `<div>[${time}] ${message}</div>`;
            results.scrollTop = results.scrollHeight;
        }

        // Gestion des erreurs globales
        window.addEventListener('error', function(e) {
            addResult(`⚠️ Erreur globale: ${e.message}`);
        });
    </script>
</body>
</html>
